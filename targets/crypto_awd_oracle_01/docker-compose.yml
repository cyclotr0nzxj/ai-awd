services:
  oracle:
    build: .
    environment:
      AIAWD_FLAG: ${AIAWD_FLAG:?AIAWD_FLAG is required}
      AIAWD_ROOM_ID: ${AIAWD_ROOM_ID:-room_unknown}
      AIAWD_TEAM_ID: ${AIAWD_TEAM_ID:-team_unknown}
    ports:
      - "127.0.0.1:${AIAWD_HTTP_PORT:-4444}:4444"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',4444), timeout=2); s.sendall(b'HEALTH'); assert s.recv(16)==b'OK\\n'; s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
