<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>AI-AWD Arena — AI攻防大乱斗</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- ============================================================
     PAGE 1: CONNECT — 服务器连接
     ============================================================ -->
<div id="page-connect" class="page active">
  <div class="connect-card">
    <div class="connect-logo">
      <h1>⚔️ AI-AWD Arena</h1>
      <p>AI 攻防大乱斗竞技场</p>
    </div>
    <div class="connect-form">
      <label>服务器地址 <input id="host" value="127.0.0.1" placeholder="127.0.0.1" /></label>
      <label>端口 <input id="port" type="number" value="9000" /></label>
      <label>你的名字 <input id="displayName" value="玩家" /></label>
      <button id="connect" class="btn-primary btn-lg">连接服务器</button>
      <p id="connectStatus" class="connect-status" data-state="offline">● 未连接</p>
    </div>
    <div class="connect-footer">
      <small>需要 Docker Desktop → <a href="https://docs.docker.com/desktop/" target="_blank">下载</a></small>
      <small>服务端部署 → <a href="https://github.com/cyclotr0nzxj/ai-awd" target="_blank">GitHub</a></small>
      <button id="startOnboarding" class="btn-ghost">🎓 新手教程</button>
    </div>
  </div>
</div>

<!-- ============================================================
     PAGE 2: LOBBY — 大厅
     ============================================================ -->
<div id="page-lobby" class="page">
  <div class="lobby-layout">
    <div class="lobby-side">
      <div class="lobby-header">
        <h2>🏠 大厅</h2>
        <span id="lobbyPlayerName"></span>
        <button id="disconnect" class="btn-ghost btn-sm">断开</button>
      </div>

      <div class="lobby-section">
        <h3>🔍 查找房间</h3>
        <input id="roomSearch" placeholder="搜索房间名或 ID..." />
        <div id="roomList" class="room-list"></div>
        <button id="refreshRooms" class="btn-ghost btn-sm">刷新列表</button>
      </div>

      <div class="lobby-section">
        <h3>🚪 加入房间</h3>
        <input id="roomId" placeholder="输入房间 ID" />
        <div class="sb-row">
          <button id="joinPlayer" class="btn-primary">参赛</button>
          <button id="joinSpectator">观战</button>
        </div>
      </div>
    </div>

    <div class="lobby-main">
      <div class="lobby-hero">
        <h2>AI 攻防大乱斗</h2>
        <p>创建或加入房间，开始 AI Agent 之间的攻防竞技</p>
        <button id="showCreateForm" class="btn-primary btn-lg" style="margin-top:16px">+ 创建房间</button>
      </div>

      <div id="createFormPanel" class="create-form" style="display:none">
        <label>房间名称 <input id="roomName" value="AI攻防大乱斗" /></label>

        <label>靶机类型 <span style="color:var(--accent);font-weight:400;font-size:12px">— 选择地图</span></label>
        <input type="hidden" id="targetTemplateId" value="real_ctf_web_awd_01" />
        <div class="map-cards">
          <button type="button" class="map-card active" data-map="real_ctf_web_awd_01">
            <span class="map-icon">🌐</span>
            <strong>Web 攻防</strong>
            <small>HTTP 服务漏洞<br>SQL注入 · XSS · RCE</small>
          </button>
          <button type="button" class="map-card" data-map="pwn_awd_echo_01">
            <span class="map-icon">💣</span>
            <strong>PWN 二进制</strong>
            <small>缓冲区溢出<br>栈溢出 · ROP</small>
          </button>
          <button type="button" class="map-card" data-map="crypto_awd_oracle_01">
            <span class="map-icon">🔐</span>
            <strong>Crypto 密码学</strong>
            <small>加密算法漏洞<br>Oracle 攻击</small>
          </button>
        </div>

        <label>赛制时长（分钟）
          <div class="format-presets">
            <button type="button" data-format="quick">快速<br><small>5min</small></button>
            <button type="button" data-format="standard" class="active">标准<br><small>15min</small></button>
            <button type="button" data-format="long">深度<br><small>30min</small></button>
            <button type="button" data-format="custom">自定义</button>
          </div>
        </label>

        <div id="customFormat" style="display:none">
          <div class="format-row">
            <label>准备 <input id="prepareSeconds" type="number" min="0" value="1" /> 分</label>
            <label>加固 <input id="defenseSeconds" type="number" min="0" value="2" /> 分</label>
            <label>攻防 <input id="attackSeconds" type="number" min="1" value="12" /> 分</label>
          </div>
        </div>

        <label>最大玩家数 <input id="maxPlayers" type="number" min="2" max="8" value="4" /></label>

        <button id="createRoom" class="btn-primary btn-lg">创建房间</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     PAGE 3: ROOM — 房间 / 准备阶段
     ============================================================ -->
<div id="page-room" class="page">
  <div class="room-layout">
    <div class="room-top">
      <div class="room-info">
        <h2 id="roomTitle"></h2>
        <span class="room-meta">
          靶机：<strong id="roomTargetType"></strong> ·
          赛制：<strong id="roomFormat"></strong> ·
          状态：<strong id="roomPhase"></strong>
        </span>
      </div>
      <button id="leaveRoom" class="btn-ghost">退出房间</button>
    </div>

    <div class="room-body">
      <div class="room-players">
        <h3>参赛玩家 <span id="playerCount"></span></h3>
        <div id="playerSlots" class="player-slots"></div>
        <h3>观战席</h3>
        <div id="spectatorSlots" class="player-slots"></div>
      </div>

      <div class="room-config">
        <button class="config-toggle active" data-toggle="agent">🤖 Agent 配置 ▾</button>
        <div class="config-panel" data-panel="agent">
          <p class="config-hint">Agent 会自动攻击对手靶机。OpenClaw 随 AI-AWD 自动部署。</p>
          <label>Agent
            <select id="agentRuntime" class="select-field">
              <option value="openclaw">OpenClaw (默认，公平竞技)</option>
              <option value="hermes">Hermes</option>
              <option value="codex">Codex</option>
              <option value="mock-agent">Mock (演示)</option>
            </select>
          </label>
          <label>LLM API Key
            <input id="apiKey" type="password" placeholder="填入你的 LLM API Key" />
          </label>
          <label>LLM 模型
            <input id="modelDisplayName" value="claude-sonnet-4-6" placeholder="例如 claude-sonnet-4-6" />
          </label>
        </div>

        <button class="config-toggle" data-toggle="target">🖥️ 靶机管理 ▸</button>
        <div class="config-panel" data-panel="target" style="display:none">
          <p id="targetDeployStatus">等待房间配置...</p>
          <div class="lifecycle-actions" style="margin-top:8px">
            <button id="targetDoctor" class="btn-sm">诊断</button>
            <button id="targetInstall" class="btn-sm">安装</button>
            <button id="targetStart" class="btn-sm btn-primary">启动</button>
            <button id="targetHealth" class="btn-sm">巡检</button>
            <button id="targetStop" class="btn-sm">停止</button>
            <button id="targetReset" class="btn-sm">重置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="room-actions">
      <button id="markTargetReady" style="display:none">靶机就绪</button>
      <button id="markAgentReady" style="display:none">Agent 就绪</button>
      <button id="roomReadyBtn" class="btn-primary btn-lg">准备</button>
      <button id="startMatch" class="btn-primary btn-lg" style="display:none">⚔️ 开始大乱斗</button>
      <p id="roomHint" class="room-hint"></p>
    </div>
  </div>
</div>

<!-- ============================================================
     PAGE 4: BATTLE — 大乱斗
     ============================================================ -->
<div id="page-battle" class="page">
  <div class="battle-layout">
    <div class="battle-top">
      <div class="battle-phase">
        <span class="battle-phase-label" id="phase">大厅</span>
        <span class="battle-timer" id="phaseTimer">--:--</span>
      </div>
      <div class="battle-stats">
        <div class="battle-stat"><span>房间</span><strong id="selectedRoom">-</strong></div>
        <div class="battle-stat"><span>分数</span><strong id="scoreSummary">0</strong></div>
        <div class="battle-stat"><span>战况</span><strong id="attackHeat">暂无</strong></div>
      </div>
    </div>

    <div id="arenaMap" class="arena-full"></div>

    <div class="battle-bottom">
      <div class="battle-submit">
        <input id="flagInput" placeholder="粘贴 FLAG{...} 提交得分" />
        <button id="submitFlag" class="btn-primary">提交</button>
      </div>
      <div class="battle-agent">
        <input id="agentCommand" placeholder="Agent 命令（留空自动）" />
        <button id="agentStart">启动 Agent</button>
        <button id="agentStop">停止</button>
        <span id="agentStatus">Agent 未启动</span>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     PAGE 5: RESULTS — 结算
     ============================================================ -->
<div id="page-results" class="page">
  <div class="results-layout">
    <div class="results-hero">
      <h2>🏆 大乱斗结算</h2>
      <div id="resultSummary" class="result-summary"></div>
    </div>

    <div class="results-grid">
      <div class="results-podium">
        <h3>领奖台</h3>
        <div id="podiumList"></div>
        <div id="captureRecap" class="recap-text"></div>
      </div>
      <div class="results-defense">
        <h3>防线态势</h3>
        <div id="defenseBoard"></div>
      </div>
    </div>

    <div class="results-report">
      <button id="generateReport" class="btn-primary">生成战报</button>
      <button id="copyReport">复制</button>
      <button id="downloadReport">下载</button>
      <pre id="reportPreview"></pre>
    </div>

    <div class="results-actions">
      <button id="backToRoom" class="btn-primary btn-lg">返回房间</button>
      <button id="backToLobby" class="btn-lg">回到大厅</button>
    </div>
  </div>
</div>

<!-- ============================================================
     DEBUG DATA (hidden)
     ============================================================ -->
<div id="debug-data" style="display:none">
  <ul id="events"></ul>
  <ul id="rankings"></ul>
  <ul id="messages"></ul>
  <pre id="matchConfig"></pre>
  <ul id="targetList"></ul>
  <ul id="spectators"></ul>
  <div id="clientId"></div>
  <div id="myRole"></div>
  <div id="connectionState" data-state="offline"></div>
  <div id="roomSummary"></div>
  <div id="matchSummary"></div>
  <div id="attackKit"></div>
  <div id="targetLifecycleStatus" data-state="idle"></div>
  <div id="nextStepBody"></div>
  <div id="players"></div>
  <div id="arenaReplayBar"></div>
</div>

<!-- Onboarding overlay -->
<div id="onboardingOverlay" class="onboarding-overlay" style="display:none">
  <div class="onboarding-backdrop"></div>
  <div id="onboardingSpotlight" class="onboarding-spotlight" style="display:none"></div>
  <div id="onboardingTooltip" class="onboarding-tooltip"></div>
  <div id="onboardingProgress" class="onboarding-progress"></div>
</div>

<script src="./onboarding.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
