services:
  web:
    build: .
    environment:
      AIAWD_FLAG: ${AIAWD_FLAG:-FLAG{placeholder}}
      AIAWD_ROOM_ID: ${AIAWD_ROOM_ID:-room_unknown}
      AIAWD_TEAM_ID: ${AIAWD_TEAM_ID:-team_unknown}
    ports:
      - "0.0.0.0:${AIAWD_HTTP_PORT:-18081}:8080"
    command: ["python", "/app/app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
